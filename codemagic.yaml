workflows:
  radio-validation:
    name: Radio 43 simulator tests
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Generate project and test
        script: |
          set -eu
          unzip -oq RadioOnlinePro_iOS_Source.zip
          cd RadioOnlinePro
          command -v xcodegen || brew install xcodegen
          xcodegen generate
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import sys,json; devices=[d for group in json.load(sys.stdin)["devices"].values() for d in group]; print(next(d["udid"] for d in devices if d["name"] in ["iPhone 17 Pro","iPhone 16 Pro","iPhone 15 Pro"]))')
          xcodebuild test -scheme RadioOnlinePro -destination "platform=iOS Simulator,id=$DEVICE" -parallel-testing-enabled NO -derivedDataPath build -resultBundlePath tests.xcresult CODE_SIGNING_ALLOWED=NO
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl status_bar "$DEVICE" override --time 9:41 --dataNetwork wifi --wifiMode active --wifiBars 3 --cellularMode active --cellularBars 4 --batteryState unplugged --batteryLevel 100
          xcrun simctl install "$DEVICE" build/Build/Products/Debug-iphonesimulator/RadioOnlinePro.app
          xcrun simctl launch "$DEVICE" com.radioonlinepro.player
          sleep 5
          xcrun simctl io "$DEVICE" screenshot Radio43-AppStore.png
    artifacts:
      - RadioOnlinePro/tests.xcresult
      - RadioOnlinePro/Radio43-AppStore.png
  radio-testflight:
    name: Radio 43 TestFlight
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Mercury Power Twin Cloud
    environment:
      xcode: latest
      ios_signing:
        provisioning_profiles:
          - radio43_codemagic_appstore
        certificates:
          - mercury_power_twin_reused_distribution
    scripts:
      - name: Generate release project
        script: |
          set -eu
          unzip -oq RadioOnlinePro_iOS_Source.zip
          cd RadioOnlinePro
          command -v xcodegen || brew install xcodegen
          LATEST=$(app-store-connect get-latest-testflight-build-number 6830363430)
          [[ "$LATEST" =~ ^[0-9]+$ ]]
          sed -i '' "s/CURRENT_PROJECT_VERSION: '1'/CURRENT_PROJECT_VERSION: '$((LATEST + 1))'/" project.yml
          xcodegen generate
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import sys,json; print(next(d["udid"] for group in json.load(sys.stdin)["devices"].values() for d in group if d["name"].startswith("iPhone")))')
          xcodebuild test -scheme RadioOnlinePro -destination "platform=iOS Simulator,id=$DEVICE" -parallel-testing-enabled NO -resultBundlePath tests.xcresult CODE_SIGNING_ALLOWED=NO
          xcode-project use-profiles
          xcode-project build-ipa --project RadioOnlinePro.xcodeproj --scheme RadioOnlinePro
    artifacts:
      - RadioOnlinePro/build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
