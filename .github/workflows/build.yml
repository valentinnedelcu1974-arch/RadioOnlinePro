name: Build and test Radio Online Pro
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: radio-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  simulator:
    runs-on: macos-15-intel
    defaults:
      run:
        working-directory: RadioOnlinePro
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Unpack native source
        working-directory: ${{ github.workspace }}
        run: unzip -o RadioOnlinePro_iOS_Source.zip
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Show toolchain
        run: xcodebuild -version
      - name: Generate project
        run: xcodegen generate
      - name: Select iPhone simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import sys,json; d=json.load(sys.stdin); print(next(x["udid"] for group in d["devices"].values() for x in group if "iPhone" in x["name"]))')
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
      - name: Build and run validation tests
        run: |
          xcodebuild test -project RadioOnlinePro.xcodeproj -scheme RadioOnlinePro -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE_ID" -derivedDataPath build -resultBundlePath TestResults.xcresult CODE_SIGNING_ALLOWED=NO
      - name: Install and launch app
        run: |
          xcrun simctl install "$DEVICE_ID" build/Build/Products/Debug-iphonesimulator/RadioOnlinePro.app
          xcrun simctl launch "$DEVICE_ID" com.radioonlinepro.player
          sleep 5
          xcrun simctl spawn "$DEVICE_ID" launchctl list | grep com.radioonlinepro.player
          xcrun simctl io "$DEVICE_ID" screenshot RadioOnlinePro-Simulator.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RadioOnlinePro-Validation
          path: |
            RadioOnlinePro/TestResults.xcresult
            RadioOnlinePro/RadioOnlinePro-Simulator.png
          retention-days: 7
